[project]
name = "rotaperfume"
version = "0.0.1"
authors = [{ name = "emersonfab06@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "rotaperfume.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# Faz 'from raw.conferencia_lib import ...' resolver em tests_unit/ sem
# __init__.py (namespace package implicito do Python 3). NAO define
# testpaths de proposito: 'uv run pytest' generico continua pegando tests/
# (que exige DatabricksSession real, como sempre exigiu); os testes puros
# so rodam isolados com 'uv run pytest tests_unit/' (ver Step 5).
pythonpath = ["src"]
