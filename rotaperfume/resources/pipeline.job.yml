# Job rotaperfume_pipeline -- cresce a cada prompt da serie "Jornada de Dados":
#   Prompt 1: raw_conferencia -- confere a chegada dos 10 CSVs no Volume
#             bronze.raw. NAO cria tabela bronze.
#   Prompt 2: + bronze_ingestao -- CSV -> tabelas Delta em bronze, sem
#             limpeza, so depois de raw_conferencia passar.
#   Prompt 3: + silver_clientes / silver_pedidos / silver_itens_e_produtos /
#             silver_crm_e_financeiro -- limpeza, tipagem e contrato (CHECK)
#             em silver, rodando em paralelo.
#   Prompt 4 (este arquivo): + gold_dimensoes -> gold_fato_vendas -> gold_marts ->
#             testes (9 testes com raise_error garantindo integridade e faturamento).
#   Prompt 5: + qualidade_dados avancada / workflow estendido
#   Prompt 6: + orquestracao final e documentacao (dashboard/Genie)
#   Noite 4, prompt 1: + gold_retorno_ligacao -- a unica tabela cujo dado
#             NAO vem do pipeline (IF NOT EXISTS, nunca OR REPLACE): o app
#             da direcao grava nela o desfecho de cada ligacao.
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/03-itens-e-produtos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: gold_retorno_ligacao
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/11-retorno-ligacao.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/09-metricas-negocio.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
            - task_key: testes
          sql_task:
            file:
              path: ../src/gold/10-auditoria-metadado.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: ml_features
          depends_on:
            - task_key: testes
          notebook_task:
            notebook_path: ../src/ml/11-features.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_modelo
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/12-modelo.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_fila
          depends_on:
            - task_key: ml_modelo
          sql_task:
            file:
              path: ../src/ml/13-fila.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
