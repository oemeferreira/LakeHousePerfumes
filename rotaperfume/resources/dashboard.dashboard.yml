# Dashboard como CODIGO no Databricks Asset Bundle.
#
# Declarado como recurso do tipo dashboards, com file_path, warehouse_id,
# dataset_catalog e dataset_schema (gold), para subir junto no deploy.
#
# dataset_catalog e dataset_schema sao o motivo de as queries do JSON usarem
# nome de tabela puro (FROM fato_vendas). E o que deixa o mesmo dashboard
# apontar para dev ou prod sem uma linha editada.

resources:
  dashboards:
    comercial:
      display_name: Rota do Perfume · Comercial
      file_path: ./dashboard-comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
